<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Holofoam</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head><body>
<main>
  <canvas aria-label="Holofoam organism field. Drag to use the selected tool."></canvas>
  <header><h1>HOLOFOAM</h1><span>Holographic Organisms Localized On Field Of Agent Models</span></header>
  <nav id="tools" class="dock" aria-label="Field tools"></nav>
  <aside id="studio"><div class="row"><label>Preset <select id="preset"><option>Loading</option></select></label><button id="reset">Reset</button><button id="pause">Pause</button><button id="step">Step</button></div><details open><summary>Field controls</summary><div class="rules"><label>East <input data-rule="east" type="range" min="0" max="1" step=".01" value=".75"></label><label>North <input data-rule="north" type="range" min="0" max="1" step=".01" value=".42"></label><label>Whirl <input data-rule="whirl" type="range" min="0" max="1" step=".01" value=".68"></label><label>Permeability <input data-rule="porous" type="range" min="0" max="1" step=".01" value=".9"></label></div></details><details open><summary>Selected organism</summary><pre id="readout"></pre></details><details><summary>Fork experiment</summary><p>Start two futures from the same moment. Keep its model; change the field.</p><div class="row"><label>Changed field <select id="what-rule"><option value="east">East field</option><option value="north">North field</option><option value="whirl">Whirl field</option><option value="porous">Permeability</option></select></label><button id="what-if">What if?</button><button id="export-comparison" disabled>Export comparison</button></div><pre id="comparison"></pre><div id="fork-view" aria-label="Compared future states"></div></details><div class="row"><label><input id="inspect" type="checkbox"> Global flow vectors</label><label><input id="senses" type="checkbox"> Through its senses</label><button id="share">Share replay</button><button id="export">Export</button><button id="capture">PNG</button><button id="record">5s WebM</button><label>Import experiment <input id="import" type="file" accept="application/json"></label></div></aside>
</main><script type="module" src="app.bundle.mjs"></script></body></html>
